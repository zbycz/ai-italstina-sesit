<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italština – sešit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #faf9f6; color: #222; }

  header {
    background: #4a3070;
    color: #fff;
    padding: 1em 2em;
    display: flex;
    align-items: center;
    gap: 2em;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.4em; }
  .toggle-btn {
    background: #fff2;
    border: 1px solid #fff6;
    color: #fff;
    padding: 0.4em 1.1em;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.95em;
    transition: background 0.2s;
  }
  .toggle-btn:hover { background: #fff3; }
  .toggle-btn.active { background: #fff4; border-color: #fffa; }

  .pages { padding: 2em; max-width: 1400px; margin: 0 auto; }

  .page-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2em;
    margin-bottom: 3em;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 8px #0001;
  }
  .page-row.originals-hidden .col-original { display: none; }
  .page-row.originals-hidden .col-transcription { grid-column: 1 / -1; }

  .col-transcription, .col-original {
    padding: 1.5em;
  }
  .col-original {
    border-left: 1px solid #eee;
    background: #f5f4f0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .col-original img {
    max-width: 100%;
    max-height: 80vh;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-shadow: 0 2px 6px #0002;
  }

  .page-label {
    font-size: 0.8em;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.4em;
  }
  .page-title {
    font-size: 1.2em;
    color: #4a3070;
    margin-bottom: 1em;
    font-weight: bold;
  }
  .note { line-height: 1.8; }
  .note table { border-collapse: collapse; margin: 0.8em 0; width: 100%; }
  .note th, .note td { padding: 3px 12px; text-align: left; }
  .note th { border-bottom: 2px solid #aaa; }
  .note tr td:first-child { font-style: italic; color: #555; }
  .note hr { border: none; border-top: 1px solid #ddd; margin: 1em 0; }
  .note ul { padding-left: 1.5em; }
  .note li { margin: 0.3em 0; }
  .note h3 { font-size: 1em; color: #4a3070; margin: 1em 0 0.4em; }
  .note em { color: #2a6020; }
  .note .cz { color: #888; font-style: normal; }
  .note .rule { margin: 0.6em 0; padding: 0.4em 0.8em; background: #f0edf7; border-left: 3px solid #9b8ec4; }
  .note .pair { display: flex; gap: 2em; flex-wrap: wrap; }
  .note .pair > div { flex: 1; min-width: 180px; }

  @media (max-width: 800px) {
    .page-row { grid-template-columns: 1fr; }
    .col-original { border-left: none; border-top: 1px solid #eee; }
    .page-row.originals-hidden .col-transcription { grid-column: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>🇮🇹 Italština – sešit</h1>
  <button class="toggle-btn" id="toggleBtn" onclick="toggleOriginals()">🖼 Skrýt originály</button>
</header>

<div class="pages" id="pagesContainer">
</div>

<script>
const pages = [
  { n: 1,  title: "ITALIANI" },
  { n: 2,  title: "Přízvuk – výslovnost" },
  { n: 3,  title: "Fráze a pozdravy" },
  { n: 4,  title: "Opakování výslovnosti / Členy" },
  { n: 5,  title: "Zájmena / Piacere / Členy" },
  { n: 6,  title: "Slovní zásoba / Základní výrazy" },
  { n: 7,  title: "Chi è? / Che cos'è?" },
  { n: 8,  title: "Srovnání / Prima volta" },
  { n: 9,  title: "Lezione 2 – Členy a předložky" },
  { n: 10, title: "Avere – mít" },
  { n: 11, title: "Předložky se členy" },
  { n: 12, title: "Slovní zásoba / Apostrof" },
  { n: 13, title: "Členy – shrnutí / Předložky pl." },
  { n: 14, title: "Cvičení / Dialog" },
  { n: 15, title: "Fráze v restauraci" },
  { n: 16, title: "V restauraci / Orientace" },
  { n: 17, title: "Omluvy / Dokumenty / Doprava" },
  { n: 18, title: "Barvy / Slovní zásoba" },
];

let originalsVisible = true;

function toggleOriginals() {
  originalsVisible = !originalsVisible;
  const btn = document.getElementById('toggleBtn');
  const rows = document.querySelectorAll('.page-row');
  rows.forEach(row => {
    row.classList.toggle('originals-hidden', !originalsVisible);
  });
  btn.textContent = originalsVisible ? '🖼 Skrýt originály' : '🖼 Zobrazit originály';
  btn.classList.toggle('active', !originalsVisible);
}

async function loadTranscription(n) {
  const res = await fetch(`${n}.html`);
  const text = await res.text();
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'text/html');
  const note = doc.querySelector('.note');
  return note ? note.innerHTML : '<p>(nepodařilo se načíst)</p>';
}

async function buildPages() {
  const container = document.getElementById('pagesContainer');
  for (const p of pages) {
    const content = await loadTranscription(p.n);
    const num = String(p.n).padStart(2, '0');
    const row = document.createElement('div');
    row.className = 'page-row';
    row.innerHTML = `
      <div class="col-transcription">
        <div class="page-label">Strana ${p.n}</div>
        <div class="page-title">${p.title}</div>
        <div class="note">${content}</div>
        <p style="margin-top:1em"><a href="${p.n}.html" style="font-size:0.85em;color:#9b8ec4">Otevřít stránku ${p.n} →</a></p>
      </div>
      <div class="col-original">
        <div class="page-label">Originál</div>
        <img src="pages/page_${num}.jpg" alt="Strana ${p.n} – originál" loading="lazy">
      </div>
    `;
    container.appendChild(row);
  }
}

buildPages();
</script>
</body>
</html>
